# TemplateApi — CI/CD AWS (OIDC) · Docker · ECR · ECS (deploy placeholder)
#
# PR (main):  lint, unit tests, Semgrep, TruffleHog — no AWS, no image push
# push main:  same validations → build image → push ECR → (ECS deploy when configured)
#
# Setup: .github/aws/README.md

name: AWS ECR / ECS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: aws-ecr-ecs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate & scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore TemplateApi.sln

      - name: Lint (dotnet format)
        run: dotnet format TemplateApi.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build TemplateApi.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test TemplateApi.sln -c Release --no-build --verbosity normal

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/csharp p/docker p/secrets

      - name: TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@v3.88.35
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  build-push:
    name: Build & push to ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REPO="${{ vars.ECR_REPOSITORY }}"
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          TAG="${{ github.sha }}"
          echo "repository=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          provenance: false

  deploy-ecs:
    name: Deploy to ECS
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --- ECS deploy (enable when task definition + service exist) ---
      # - name: Render Amazon ECS task definition
      #   id: render
      #   uses: aws-actions/amazon-ecs-render-task-definition@v1
      #   with:
      #     task-definition: .github/aws/ecs-task-definition.json
      #     container-name: ${{ vars.ECS_CONTAINER_NAME }}
      #     image: ${{ needs.build-push.outputs.image_uri }}

      # - name: Deploy to Amazon ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   with:
      #     task-definition: ${{ steps.render.outputs.task-definition }}
      #     service: ${{ vars.ECS_SERVICE }}
      #     cluster: ${{ vars.ECS_CLUSTER }}
      #     wait-for-service-stability: true

      - name: ECS deploy placeholder
        run: |
          echo "Image pushed: ${{ needs.build-push.outputs.image_uri }}"
          echo "Configure vars ECS_CLUSTER, ECS_SERVICE, ECS_CONTAINER_NAME and uncomment deploy steps in .github/workflows/aws-ecr-ecs.yml"
